version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare-rag-backend
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-default_secret}
      - APP_ENV=production
      - CORS_ORIGINS=http://localhost,http://localhost:80
      - GEMINI_LLM_MODEL=${GEMINI_LLM_MODEL:-gemini-2.0-flash-lite}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcare-rag-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
